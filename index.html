
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OZEN AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      isolation: isolate;
      background: #06152b;
      font-family: 'Inter', sans-serif;
      color: white;
    }

    .video-background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      pointer-events: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(2, 10, 28, 0.25);
      z-index: -1;
      pointer-events: none;
    }

    .login {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      margin: auto;
      padding: 35px 25px;
      text-align: center;
      background: rgba(7, 22, 48, 0.12);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      border: 1px solid rgba(120,190,255,.25);
      border-radius: 25px;
      box-shadow: 0 20px 60px #0007;
    }

    .avatar {
      width: 105px;
      height: 105px;
      margin: 0 auto 20px;
      border-radius: 50%;
      border: 3px solid #48baff;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #123c70;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(72,186,255,.35);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      margin: 8px 0;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 30px;
      font-weight: 700;
    }

    .sub {
      color: #d0e5ff;
      margin-bottom: 28px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 17px;
      border-radius: 13px;
      border: 1px solid #398bd2;
      background: rgba(7, 26, 53, 0.85);
      color: white;
      text-align: center;
      font-size: 25px;
      letter-spacing: 12px;
      outline: none;
    }

    input:focus {
      border-color: #48baff;
      box-shadow: 0 0 15px rgba(72,186,255,.3);
    }

    .ozen-button {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      width: 100%;
      margin-top: 18px;
      padding: 17px 12px;
      border: 2px solid #ff8a24;
      border-radius: 14px;
      background: rgba(8, 30, 55, 0.85);
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow:
        0 0 8px #ff8a24,
        0 0 18px rgba(255, 120, 20, 0.5);
      animation: orangeGlow 1.8s infinite alternate;
    }

    .runner {
      display: inline-block;
      font-size: 24px;
      animation: running 0.4s infinite alternate;
    }

    .ozen-button::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 0;
      left: -100%;
      width: 45%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 170, 70, 0.4),
        transparent
      );
      animation: orangeLight 2s infinite;
      pointer-events: none;
    }

    @keyframes running {
      from {
        transform: translateY(-2px) rotate(-8deg);
      }
      to {
        transform: translateY(2px) rotate(8deg);
      }
    }

    @keyframes orangeGlow {
      from {
        box-shadow: 0 0 6px #ff7918;
      }
      to {
        box-shadow:
          0 0 12px #ff8a24,
          0 0 28px #ff6500,
          0 0 40px rgba(255, 100, 0, 0.35);
      }
    }

    @keyframes orangeLight {
      to {
        left: 150%;
      }
    }

    #status {
      min-height: 22px;
      margin-top: 17px;
      color: #ffaaaa;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <video class="video-background" autoplay muted loop playsinline>
    <source src="/fundo2.mp4" type="video/mp4">
  </video>

  <main class="login">

    <div class="avatar">
      <img src="/enzo.jpg" alt="Foto de Enzo">
    </div>

    <h1>Bem-vindo, Enzo!</h1>
    <p class="sub">Sua inteligência pessoal está esperando.</p>

    <form id="loginForm">
      <input
        id="pin"
        type="password"
        inputmode="numeric"
        maxlength="6"
        pattern="[0-9]{6}"
        placeholder="••••••"
        autocomplete="current-password"
        required
      >

      <button type="submit" class="ozen-button">
        <span class="runner">🏃</span>
        <span>ENTRAR NA OZEN</span>
      </button>
    </form>

    <p id="status"></p>

  </main>

  <script>
    const form = document.getElementById("loginForm");
    const pin = document.getElementById("pin");
    const status = document.getElementById("status");

    pin.addEventListener("input", () => {
      pin.value = pin.value.replace(/\D/g, "").slice(0, 6);
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "Verificando acesso...";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: pin.value })
        });

        const data = await response.json();

        if (!response.ok) {
          status.textContent = data.error || "Não foi possível entrar.";
          return;
        }

        window.location.href = "/chat.html";
      } catch {
        status.textContent = "Erro de conexão. Tente novamente.";
      }
    });
  </script>

</body>
</html>
