
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OZEN AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background:
    radial-gradient(circle at 50% 0%, #102b58 0%, transparent 40%),
    linear-gradient(145deg, #050b18, #08152b 55%, #050b18);
  color: #fff;
  font-family: 'Inter', sans-serif;
  display: flex;
  flex-direction: column;
}

/* CABEÇALHO */

header {
  height: 76px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 13px;
  border-bottom: 1px solid rgba(100,160,255,.13);
  background: rgba(5,13,29,.75);
  backdrop-filter: blur(18px);
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
  border: 2px solid #168cff;
  box-shadow: 0 0 18px rgba(0,132,255,.35);
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.header-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.header-info h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 19px;
  margin: 0;
  letter-spacing: 1px;
}

.status {
  font-size: 11px;
  color: #48dba0;
  display: flex;
  align-items: center;
  gap: 6px;
}

.status::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #35e6a0;
  box-shadow: 0 0 8px #35e6a0;
}

/* ÁREA DAS MENSAGENS */

#messages {
  flex: 1;
  width: 100%;
  max-width: 850px;
  margin: 0 auto;
  padding: 25px 18px 30px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.welcome {
  text-align: center;
  margin: auto 0;
  padding: 30px 15px;
}

.welcome h2 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 28px;
  margin-bottom: 10px;
  background: linear-gradient(90deg, #fff, #58b5ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.welcome p {
  color: #8ea5c8;
  font-size: 14px;
  line-height: 1.6;
}

.message {
  display: flex;
  flex-direction: column;
  max-width: 85%;
  animation: appear .25s ease;
}

.message.user {
  align-self: flex-end;
}

.message.ozen {
  align-self: flex-start;
}

.message-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #78baff;
  margin: 0 8px 7px;
}

.message.user .message-label {
  text-align: right;
  color: #a6b9d6;
}

.bubble {
  padding: 14px 17px;
  border-radius: 17px;
  font-size: 14px;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user .bubble {
  background: linear-gradient(135deg, #087cf0, #1453bb);
  border-bottom-right-radius: 5px;
  box-shadow: 0 5px 20px rgba(0,105,255,.16);
}

.ozen .bubble {
  background: rgba(20,39,70,.85);
  border: 1px solid rgba(91,151,231,.16);
  border-bottom-left-radius: 5px;
  color: #e5efff;
}

/* DIGITANDO */

.typing {
  display: none;
  align-self: flex-start;
  padding: 14px 17px;
  background: rgba(20,39,70,.85);
  border: 1px solid rgba(91,151,231,.16);
  border-radius: 16px;
  gap: 5px;
}

.typing span {
  width: 6px;
  height: 6px;
  background: #54aaff;
  border-radius: 50%;
  animation: bounce 1s infinite;
}

.typing span:nth-child(2) {
  animation-delay: .15s;
}

.typing span:nth-child(3) {
  animation-delay: .3s;
}

/* ÁREA DE ENVIO */

footer {
  position: sticky;
  bottom: 0;
  padding: 15px 16px calc(15px + env(safe-area-inset-bottom));
  background: rgba(5,13,29,.88);
  border-top: 1px solid rgba(100,160,255,.13);
  backdrop-filter: blur(18px);
}

.input-area {
  max-width: 850px;
  margin: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 8px 7px 17px;
  border-radius: 18px;
  background: #101f38;
  border: 1px solid rgba(85,153,255,.25);
  transition: .2s;
}

.input-area:focus-within {
  border-color: #168cff;
  box-shadow: 0 0 18px rgba(0,132,255,.12);
}

#userInput {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-family: inherit;
  font-size: 14px;
  padding: 12px 0;
}

#userInput::placeholder {
  color: #7589a8;
}

#sendButton {
  width: 43px;
  height: 43px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #168cff, #0756d9);
  color: white;
  font-size: 20px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: .2s;
}

#sendButton:active {
  transform: scale(.92);
}

#sendButton:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.footer-note {
  text-align: center;
  color: #536987;
  font-size: 10px;
  margin-top: 10px;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-5px); }
}

@media (max-width: 500px) {
  header {
    height: 68px;
    padding: 0 15px;
  }

  .logo {
    width: 43px;
    height: 43px;
  }

  #messages {
    padding: 20px 13px;
  }

  .message {
    max-width: 91%;
  }

  .welcome h2 {
    font-size: 25px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="/ozen.png" alt="OZEN">
  </div>

  <div class="header-info">
    <h1>OZEN</h1>
    <div class="status">Online</div>
  </div>
</header>

<main id="messages">
  <div class="welcome" id="welcome">
    <h2>Olá, Enzo! 👋</h2>
    <p>Sou a OZEN. Estou aqui para conversar,<br>
    ajudar e acompanhar suas ideias.</p>
  </div>

  <div class="typing" id="typing">
    <span></span>
    <span></span>
    <span></span>
  </div>
</main>

<footer>
  <div class="input-area">
    <input
      id="userInput"
      type="text"
      placeholder="Converse com a OZEN..."
      autocomplete="off"
    >

    <button id="sendButton" onclick="sendMessage()">➤</button>
  </div>

  <div class="footer-note">
    OZEN AI · Sua inteligência artificial pessoal
  </div>
</footer>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("userInput");
const sendButton = document.getElementById("sendButton");
const typing = document.getElementById("typing");
const welcome = document.getElementById("welcome");

const history = [];
let sending = false;

/* VERIFICAR LOGIN */

async function checkSession() {
  try {
    const response = await fetch("/api/session");

    if (!response.ok) {
      window.location.href = "/";
    }
  } catch (error) {
    window.location.href = "/";
  }
}

checkSession();

/* ADICIONAR MENSAGEM */

function addMessage(text, type) {
  if (welcome) {
    welcome.style.display = "none";
  }

  const container = document.createElement("div");
  container.className = "message " + type;

  const label = document.createElement("div");
  label.className = "message-label";
  label.textContent = type === "user" ? "VOCÊ" : "OZEN";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  container.appendChild(label);
  container.appendChild(bubble);

  messages.insertBefore(container, typing);
  messages.scrollTop = messages.scrollHeight;
}

/* ENVIAR MENSAGEM */

async function sendMessage() {
  const message = input.value.trim();

  if (!message || sending) return;

  sending = true;
  sendButton.disabled = true;

  addMessage(message, "user");

  input.value = "";
  typing.style.display = "flex";
  messages.scrollTop = messages.scrollHeight;

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message,
        history: history
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Não consegui responder agora.");
    }

    const answer = data.answer || data.reply || data.response;

    if (!answer) {
      throw new Error("A OZEN não retornou uma resposta.");
    }

    history.push({
      role: "user",
      text: message
    });

    history.push({
      role: "model",
      text: answer
    });

    addMessage(answer, "ozen");

  } catch (error) {
    addMessage(
      "Desculpe, Enzo. Tive um problema ao responder. Tente novamente daqui a pouco.",
      "ozen"
    );

    console.error(error);

  } finally {
    typing.style.display = "none";
    sending = false;
    sendButton.disabled = false;
    input.focus();
  }
}

/* ENVIAR COM ENTER */

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});
</script>

</body>
</html>
