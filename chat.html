
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OZEN AI</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#06152b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OZEN AI">
<link rel="icon" type="image/png" href="/ozen.png">
<link rel="apple-touch-icon" href="/ozen.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: #050b18;
  color: #fff;
  font-family: 'Inter', sans-serif;
  display: flex;
  flex-direction: column;
  position: relative;
  isolation: isolate;
}

#backgroundVideo {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
  pointer-events: none;
}

body::before {
  display: none;
}

header {
  min-height: 76px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 13px;
  border-bottom: 1px solid rgba(100,160,255,.13);
  background: transparent;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
  border: 2px solid #168cff;
  box-shadow: 0 0 18px rgba(0,132,255,.35);
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.header-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.header-info h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 19px;
  margin: 0;
  letter-spacing: 1px;
  text-shadow: 0 2px 8px #000;
}

.status {
  font-size: 11px;
  color: #48dba0;
  display: flex;
  align-items: center;
  gap: 6px;
  text-shadow: 0 2px 5px #000;
}

.status::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #35e6a0;
  box-shadow: 0 0 8px #35e6a0;
}

#messages {
  flex: 1;
  width: 100%;
  max-width: 850px;
  margin: 0 auto;
  padding: 25px 18px 30px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  overflow-y: auto;
}

.welcome {
  text-align: center;
  margin: auto 0;
  padding: 30px 15px;
}

.welcome h2 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 28px;
  margin-bottom: 10px;
  background: linear-gradient(90deg, #fff, #58b5ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 5px rgba(0,0,0,.7));
}

.welcome p {
  color: #fff;
  font-size: 14px;
  line-height: 1.6;
  text-shadow: 0 2px 6px rgba(0,0,0,.9);
}

.message {
  display: flex;
  flex-direction: column;
  max-width: 85%;
  animation: appear .25s ease;
}

.message.user {
  align-self: flex-end;
}

.message.ozen {
  align-self: flex-start;
}

.message-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #78baff;
  margin: 0 8px 7px;
  text-shadow: 0 2px 5px #000;
}

.message.user .message-label {
  text-align: right;
  color: #fff;
}

.bubble {
  padding: 14px 17px;
  border-radius: 17px;
  font-size: 14px;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user .bubble {
  background: linear-gradient(135deg, #087cf0, #1453bb);
  border-bottom-right-radius: 5px;
  box-shadow: 0 5px 20px rgba(0,105,255,.16);
}

.ozen .bubble {
  background: rgba(13,30,57,.88);
  border: 1px solid rgba(91,151,231,.25);
  border-bottom-left-radius: 5px;
  color: #e5efff;
}

.typing {
  display: none;
  align-self: flex-start;
  padding: 14px 17px;
  background: rgba(13,30,57,.88);
  border: 1px solid rgba(91,151,231,.25);
  border-radius: 16px;
  gap: 5px;
}

.typing span {
  width: 6px;
  height: 6px;
  background: #54aaff;
  border-radius: 50%;
  animation: bounce 1s infinite;
}

.typing span:nth-child(2) {
  animation-delay: .15s;
}

.typing span:nth-child(3) {
  animation-delay: .3s;
}

footer {
  position: sticky;
  bottom: 0;
  padding: 15px 16px calc(15px + env(safe-area-inset-bottom));
  background: transparent;
  border-top: 1px solid rgba(100,160,255,.13);
}

.input-area {
  max-width: 850px;
  margin: auto;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 8px 7px 17px;
  border-radius: 18px;
  background: rgba(16,31,56,.91);
  border: 1px solid rgba(85,153,255,.3);
  transition: .2s;
}

.input-area:focus-within {
  border-color: #168cff;
  box-shadow: 0 0 18px rgba(0,132,255,.12);
}

#userInput {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-family: inherit;
  font-size: 14px;
  padding: 12px 0;
}

#userInput::placeholder {
  color: #a0b2ce;
}

#sendButton,
#micButton {
  width: 43px;
  height: 43px;
  flex-shrink: 0;
  border: none;
  border-radius: 14px;
  color: white;
  font-size: 19px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: .2s;
}

#sendButton {
  background: linear-gradient(135deg, #168cff, #0756d9);
}

#micButton {
  background: rgba(50,100,160,.55);
  border: 1px solid rgba(100,170,255,.35);
}

#micButton.listening {
  background: #e53e55;
  box-shadow: 0 0 18px rgba(229,62,85,.5);
  animation: pulse 1.2s infinite;
}

#sendButton:active,
#micButton:active {
  transform: scale(.92);
}

#sendButton:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.voice-status {
  text-align: center;
  color: #b8d9ff;
  font-size: 11px;
  min-height: 16px;
  margin-top: 8px;
  text-shadow: 0 2px 5px #000;
}

.footer-note {
  text-align: center;
  color: #fff;
  font-size: 10px;
  margin-top: 7px;
  text-shadow: 0 2px 5px #000;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-5px); }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

@media (max-width: 500px) {
  header {
    min-height: 68px;
    padding: 0 15px;
  }

  .logo {
    width: 43px;
    height: 43px;
  }

  #messages {
    padding: 20px 13px;
  }

  .message {
    max-width: 91%;
  }

  .welcome h2 {
    font-size: 25px;
  }
}
</style>
</head>

<body>

<video id="backgroundVideo" autoplay muted loop playsinline>
  <source src="/fundo2.mp4" type="video/mp4">
</video>

<header>
  <div class="logo">
    <img src="/ozen.png" alt="OZEN">
  </div>

  <div class="header-info">
    <h1>OZEN</h1>
    <div class="status" id="onlineStatus">Online</div>
  </div>
</header>

<main id="messages">
  <div class="welcome" id="welcome">
    <h2>Olá, Enzo! 👋</h2>
    <p>
      Sou a OZEN. Estou aqui para conversar,<br>
      ajudar e acompanhar suas ideias.
    </p>
  </div>

  <div class="typing" id="typing">
    <span></span><span></span><span></span>
  </div>
</main>

<footer>
  <div class="input-area">
    <input
      id="userInput"
      type="text"
      placeholder="Converse com a OZEN..."
      autocomplete="off"
    >

    <button id="micButton" type="button" aria-label="Falar com a OZEN" title="Falar">
      🎙️
    </button>

    <button id="sendButton" type="button" onclick="sendMessage()">
      ➤
    </button>
  </div>

  <div class="voice-status" id="voiceStatus">
    Toque no microfone para falar
  </div>

  <div class="footer-note">
    OZEN AI · Criada e desenvolvida por Enzo Brandão
  </div>
</footer>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("userInput");
const sendButton = document.getElementById("sendButton");
const micButton = document.getElementById("micButton");
const typing = document.getElementById("typing");
const welcome = document.getElementById("welcome");
const voiceStatus = document.getElementById("voiceStatus");

const history = [];
let sending = false;
let recognition = null;
let listening = false;

/* VERIFICAR LOGIN */

async function checkSession() {
  try {
    const response = await fetch("/api/session");

    if (!response.ok) {
      window.location.href = "/";
    }
  } catch (error) {
    window.location.href = "/";
  }
}

checkSession();

/* ADICIONAR MENSAGEM */

function addMessage(text, type) {
  if (welcome) {
    welcome.style.display = "none";
  }

  const container = document.createElement("div");
  container.className = "message " + type;

  const label = document.createElement("div");
  label.className = "message-label";
  label.textContent = type === "user" ? "VOCÊ" : "OZEN";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  container.appendChild(label);
  container.appendChild(bubble);

  messages.insertBefore(container, typing);
  messages.scrollTop = messages.scrollHeight;
}

/* RESPOSTA FALADA DA OZEN */

function speak(text) {
  if (!("speechSynthesis" in window)) {
    voiceStatus.textContent = "Áudio não disponível neste navegador.";
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "pt-BR";
  utterance.rate = 1;
  utterance.pitch = 1;
  utterance.volume = 1;

  utterance.onstart = function() {
    voiceStatus.textContent = "OZEN está falando...";
  };

  utterance.onend = function() {
    if (!listening) {
      voiceStatus.textContent = "Toque no microfone para falar";
    }
  };

  utterance.onerror = function() {
    voiceStatus.textContent = "Não foi possível reproduzir a voz.";
  };

  window.speechSynthesis.speak(utterance);
}

/* PARAR A VOZ */

function stopSpeaking() {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
}

/* RECONHECIMENTO DE VOZ */

function setupVoice() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    micButton.disabled = true;
    micButton.style.opacity = ".4";
    voiceStatus.textContent =
      "Reconhecimento de voz não disponível neste navegador.";
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "pt-BR";
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = function() {
    listening = true;
    micButton.classList.add("listening");
    micButton.textContent = "⏹";
    voiceStatus.textContent = "Estou ouvindo você, Enzo...";
    stopSpeaking();
  };

  recognition.onresult = function(event) {
    let finalText = "";
    let interimText = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;

      if (event.results[i].isFinal) {
        finalText += transcript;
      } else {
        interimText += transcript;
      }
    }

    if (interimText) {
      voiceStatus.textContent = "Ouvindo: " + interimText;
    }

    if (finalText.trim()) {
      input.value = finalText.trim();
    }
  };

  recognition.onerror = function(event) {
    listening = false;
    micButton.classList.remove("listening");
    micButton.textContent = "🎙️";

    if (event.error === "not-allowed") {
      voiceStatus.textContent =
        "Permita o acesso ao microfone nas configurações do navegador.";
    } else if (event.error === "no-speech") {
      voiceStatus.textContent = "Não ouvi sua voz. Tente novamente.";
    } else {
      voiceStatus.textContent = "Erro no microfone. Tente novamente.";
    }
  };

  recognition.onend = function() {
    listening = false;
    micButton.classList.remove("listening");
    micButton.textContent = "🎙️";

    if (input.value.trim() && !sending) {
      sendMessage(true);
    } else {
      voiceStatus.textContent = "Toque no microfone para falar";
    }
  };
}

/* LIGAR E DESLIGAR MICROFONE */

micButton.addEventListener("click", function() {
  if (!recognition) {
    setupVoice();
  }

  if (!recognition) return;

  if (listening) {
    recognition.stop();
  } else {
    stopSpeaking();

    try {
      recognition.start();
    } catch (error) {
      voiceStatus.textContent =
        "Aguarde um instante e tente novamente.";
    }
  }
});

/* ENVIAR MENSAGEM */

async function sendMessage(fromVoice = false) {
  const message = input.value.trim();

  if (!message || sending) return;

  sending = true;
  sendButton.disabled = true;
  micButton.disabled = true;

  addMessage(message, "user");
  input.value = "";
  typing.style.display = "flex";
  voiceStatus.textContent = "A OZEN está pensando...";
  messages.scrollTop = messages.scrollHeight;

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message,
        history: history
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Não consegui responder agora.");
    }

    const answer = data.answer || data.reply || data.response;

    if (!answer) {
      throw new Error("A OZEN não retornou uma resposta.");
    }

    history.push({ role: "user", text: message });
    history.push({ role: "model", text: answer });

    addMessage(answer, "ozen");

    /* A OZEN FALA A RESPOSTA */

    speak(answer);

  } catch (error) {
    addMessage(
      "Desculpe, Enzo. Tive um problema ao responder. Tente novamente daqui a pouco.",
      "ozen"
    );

    console.error(error);

  } finally {
    typing.style.display = "none";
    sending = false;
    sendButton.disabled = false;
    micButton.disabled = false;
    input.focus();
  }
}

/* ENVIAR COM ENTER */

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});

/* PREPARAR A OZEN COMO APLICATIVO */

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("/sw.js")
      .catch(function(error) {
        console.error("Erro ao registrar aplicativo:", error);
      });
  });
}

/* INICIAR RECURSOS DE VOZ */

setupVoice();
</script>

</body>
</html>
