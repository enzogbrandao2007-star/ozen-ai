
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06152b">
  <title>OZEN — Sua IA pessoal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      background:
        radial-gradient(ellipse at top, #12365b 0%, transparent 55%),
        #06152b;
      color: white;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      min-height: 78px;
      padding: 13px 18px;
      background: rgba(8, 29, 55, 0.92);
      border-bottom: 1px solid rgba(70, 160, 230, 0.25);
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 5px 25px #0003;
      z-index: 2;
    }

    .logo {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border-radius: 15px;
      background: linear-gradient(135deg,#087ce5,#53c4ff);
      display: grid;
      place-items: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: bold;
      font-size: 24px;
      box-shadow: 0 0 22px #1689ee66;
    }

    .brand {
      flex: 1;
    }

    header strong {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 21px;
      letter-spacing: 1px;
    }

    header small {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #a9d9ff;
      margin-top: 4px;
      font-size: 11px;
    }

    .online-dot {
      width: 7px;
      height: 7px;
      background: #39e69b;
      border-radius: 50%;
      box-shadow: 0 0 9px #39e69b;
    }

    .header-tag {
      border: 1px solid #28659a;
      background: #102e4c;
      color: #8bcaff;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: bold;
    }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 22px 15px 25px;
      display: flex;
      flex-direction: column;
      gap: 17px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar {
      width: 5px;
    }

    #messages::-webkit-scrollbar-thumb {
      background: #24517a;
      border-radius: 10px;
    }

    .welcome {
      text-align: center;
      margin: 18px 0 12px;
      color: #b6d9ff;
      font-size: 12px;
    }

    .welcome-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 12px;
      border-radius: 19px;
      background: linear-gradient(135deg,#087ce5,#53c4ff);
      display: grid;
      place-items: center;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 30px;
      font-weight: bold;
      color: white;
      box-shadow: 0 0 30px #1689ee55;
    }

    .message {
      max-width: 88%;
      padding: 14px 16px;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 14px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      animation: appear .25s ease;
    }

    .bot {
      align-self: flex-start;
      background: linear-gradient(145deg,#153454,#102943);
      border: 1px solid #24517a;
      border-bottom-left-radius: 5px;
      box-shadow: 0 5px 20px #0002;
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(135deg,#087bd1,#1264b5);
      border: 1px solid #359de9;
      border-bottom-right-radius: 5px;
      box-shadow: 0 5px 20px #087bd133;
    }

    .message-label {
      display: block;
      font-size: 10px;
      font-weight: bold;
      color: #81c9ff;
      margin-bottom: 6px;
      letter-spacing: .5px;
    }

    .user .message-label {
      color: #d2ebff;
    }

    .typing {
      align-self: flex-start;
      padding: 15px 18px;
      background: #153454;
      border: 1px solid #24517a;
      border-radius: 17px;
      display: flex;
      gap: 5px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: #69c6ff;
      border-radius: 50%;
      animation: typing 1s infinite alternate;
    }

    .typing span:nth-child(2) {
      animation-delay: .2s;
    }

    .typing span:nth-child(3) {
      animation-delay: .4s;
    }

    footer {
      padding: 13px;
      padding-bottom: max(13px, env(safe-area-inset-bottom));
      background: rgba(8, 29, 55, 0.97);
      border-top: 1px solid rgba(70, 160, 230, 0.25);
      display: flex;
      gap: 9px;
      align-items: center;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px 16px;
      border: 1px solid #24517a;
      border-radius: 15px;
      background: #102a48;
      color: white;
      outline: none;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: .2s;
    }

    input:focus {
      border-color: #39aaff;
      box-shadow: 0 0 14px #1689ee33;
    }

    input::placeholder {
      color: #8ba8c4;
    }

    button {
      width: 52px;
      height: 50px;
      flex-shrink: 0;
      border: 1px solid #53bdff;
      border-radius: 15px;
      background: linear-gradient(135deg,#087ce5,#36b3ff);
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 0 16px #1689ee44;
      transition: .2s;
    }

    button:active {
      transform: scale(.94);
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    button svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .footer-note {
      background: rgba(8, 29, 55, 0.97);
      color: #7598b9;
      text-align: center;
      font-size: 10px;
      padding: 0 10px 9px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(7px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes typing {
      from {
        opacity: .35;
        transform: translateY(0);
      }
      to {
        opacity: 1;
        transform: translateY(-5px);
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">O</div>

    <div class="brand">
      <strong>OZEN</strong>
      <small>
        <span class="online-dot"></span>
        Sua inteligência pessoal
      </small>
    </div>

    <div class="header-tag">AI ASSISTANT</div>
  </header>

  <main id="messages">

    <div class="welcome">
      <div class="welcome-icon">O</div>
      <strong>OZEN INTELLIGENCE</strong>
      <p>Seu espaço pessoal de inteligência.</p>
    </div>

    <div class="message bot">
      <span class="message-label">OZEN</span>
      Olá, Enzo! 💙 Sou a OZEN. Estou pronta para ajudar você. O que vamos fazer hoje?
    </div>

  </main>

  <footer>
    <input
      id="messageInput"
      placeholder="Converse com a OZEN..."
      autocomplete="off"
    >

    <button id="sendButton" aria-label="Enviar mensagem">
      <svg viewBox="0 0 24 24">
        <path d="M22 2L11 13"></path>
        <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
      </svg>
    </button>
  </footer>

  <div class="footer-note">
    OZEN AI • Sua inteligência pessoal
  </div>

  <script>
    (async function protegerPagina() {
      try {
        const resposta = await fetch("/api/session", {
          cache: "no-store"
        });

        if (!resposta.ok) {
          window.location.replace("/");
          return;
        }
      } catch {
        window.location.replace("/");
      }
    })();

    const messages = document.getElementById("messages");
    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");
    const history = [];

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;

      const label = document.createElement("span");
      label.className = "message-label";
      label.textContent = type === "user" ? "VOCÊ" : "OZEN";

      const content = document.createElement("span");
      content.textContent = text;

      div.appendChild(label);
      div.appendChild(content);

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "typing";
      div.id = "typingIndicator";

      for (let i = 0; i < 3; i++) {
        div.appendChild(document.createElement("span"));
      }

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function hideTyping() {
      const typing = document.getElementById("typingIndicator");
      if (typing) typing.remove();
    }

    async function sendMessage() {
      const message = input.value.trim();

      if (!message || button.disabled) return;

      addMessage(message, "user");
      input.value = "";
      history.push({ role: "user", text: message });

      button.disabled = true;
      showTyping();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            history: history.slice(0, -1)
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Não consegui responder.");
        }

        hideTyping();

        addMessage(data.answer, "bot");
        history.push({ role: "model", text: data.answer });

      } catch (error) {
        hideTyping();
        addMessage(error.message || "Erro de conexão.", "bot");
        history.pop();
      } finally {
        button.disabled = false;
        input.focus();
      }
    }

    button.addEventListener("click", sendMessage);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
