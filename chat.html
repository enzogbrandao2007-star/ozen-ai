
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OZEN — Sua IA pessoal</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      background: #071629;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 19px;
      background: #0b2342;
      border-bottom: 1px solid #17436c;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(135deg,#1689ee,#53c4ff);
      display: grid;
      place-items: center;
      font-weight: bold;
      font-size: 20px;
    }

    header strong { font-size: 20px; }
    header small { display: block; color: #81c9ff; margin-top: 4px; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 85%;
      padding: 13px 16px;
      border-radius: 17px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .bot {
      align-self: flex-start;
      background: #142e4c;
      border: 1px solid #204b73;
    }

    .user {
      align-self: flex-end;
      background: #087bd1;
    }

    footer {
      padding: 13px;
      background: #0b2342;
      border-top: 1px solid #17436c;
      display: flex;
      gap: 9px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: 1px solid #24517a;
      border-radius: 13px;
      background: #102a48;
      color: white;
      outline: none;
      font-size: 15px;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 0 19px;
      background: #1689ee;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">O</div>
    <div>
      <strong>OZEN</strong>
      <small>Sua inteligência pessoal</small>
    </div>
  </header>

  <main id="messages">
    <div class="message bot">
      Olá, Enzo! Sou a OZEN. Como posso te ajudar hoje?
    </div>
  </main>

  <footer>
    <input id="messageInput" placeholder="Converse com a OZEN..." autocomplete="off">
    <button id="sendButton">Enviar</button>
  </footer>

  <script> 
(async function protegerPagina() {
  try {
    const resposta = await fetch("/api/session", {
      cache: "no-store"
    });

    if (!resposta.ok) {
      window.location.replace("/");
      return;
    }
  } catch {
    window.location.replace("/");
  }
})();
    
    const messages = document.getElementById("messages");
    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");
    const history = [];

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message || button.disabled) return;

      addMessage(message, "user");
      input.value = "";
      history.push({ role: "user", text: message });
      button.disabled = true;
      button.textContent = "...";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            history: history.slice(0, -1)
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Não consegui responder.");
        }

        addMessage(data.answer, "bot");
        history.push({ role: "model", text: data.answer });
      } catch (error) {
        addMessage(error.message || "Erro de conexão.", "bot");
      } finally {
        button.disabled = false;
        button.textContent = "Enviar";
        input.focus();
      }
    }

    button.addEventListener("click", sendMessage);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
